name: GolfDay CI
on:
  push:
    branches: [master, "claude/**"]
    paths: ["golfday/**", ".github/workflows/golfday-ci.yml"]
  pull_request:
    paths: ["golfday/**", ".github/workflows/golfday-ci.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: golfday
    env:
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: golfday/package-lock.json
      - run: npm ci
      - name: Install Chromium for the browser journey
        run: npx playwright-core install --with-deps chromium
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Seed database (schema smoke test)
        run: npm run db:reset
      - name: Build
        run: npm run build
      - name: Full golf-day browser journey
        run: npm run e2e
      # An app newer than its database is the failure that reached production
      # once: boot, then `no such column` on every page. This boots the real
      # build against a database that predates the columns and expects it to
      # repair itself, on boot and again at runtime.
      - name: Upgrade a database that is behind
        run: npm run e2e:upgrade
